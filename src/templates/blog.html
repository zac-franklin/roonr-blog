{% extends "base.html" %}

{% block content %}
<div style="max-width: 1100px;margin-left: auto; margin-right: auto; margin-top: 40px;">
	<div class="comic-container blogs" style="float:left;margin-top: 20px;">
		<div class="comic" text="">
			<p>{{ section.title }}</p>
		</div>
	</div>
	{% for page in section.pages %}
	<div class="about-me-border" style="margin-top: 20px; margin-bottom: 20px; padding-top: 80px; padding-bottom: 80px; padding-left: 50px; padding-right: 50px;">
		<a href="{{ page.permalink | safe }}" class="blog-post" style="position:relative;clear:both;margin-top:85px;padding-bottom:100px;container-type: inline-size;">
			<div class="post-container post-font-size">
				<div>
					<div class="blog-dev-shadow"></div>
					{{ page.title }}
				</div>
			</div>
		</a>
	</div>
	{% endfor %}
</div>
{% endblock content %}
