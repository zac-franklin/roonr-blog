{% extends "base.html" %}

{% block content %}
<div style="margin-left: auto; margin-right: auto; margin-top: 40px;">
	<div class="comic-container blogs" style="float:left;margin-top: 20px;">
		<div class="comic" text="">
			<p>{{ page.title }}</p>
                </div>
	</div>
</div>

<div class="about-me-border" style="margin-top: 20px; margin-bottom: 20px; padding-top: 80px; padding-bottom: 80px; padding-left: 50px; padding-right: 50px;">
        
        <div style="z-index:-1;aspect-ratio:5/4;max-width:1300px;width:calc(100% - 150px);position:fixed;top:55%;">
                <div class="about-me-text-shadow"></div>
        </div>
        
        <div class="page-content" style="clear:both">
                {{ page.content | safe }}
        </div>
</div>

<div class="giscus"></div>

<script src="https://giscus.app/client.js"
        data-repo="zac-franklin/roonr-blog"
        data-repo-id="R_kgDOHdEH4g"
        data-category="Blog Comments"
        data-category-id="DIC_kwDOHdEH4s4CPoXq"
        data-mapping="specific"
        data-term="{{ page.title }}"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-theme="preferred_color_scheme"
	data-lang="en"
        crossorigin="anonymous"
	async>
</script>

{% endblock content %}
